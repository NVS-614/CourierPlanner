name: Deploy to MonsterASP.NET

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Stage application
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $publish = Join-Path $root "publish"
          New-Item -ItemType Directory -Path $publish -Force | Out-Null

          Get-ChildItem -Force $root |
            Where-Object {
              $_.Name -notin @(".git", ".github", "node_modules", "publish", ".env") -and
              $_.Name -notlike ".env.*"
            } |
            ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $publish -Recurse -Force
            }

          Copy-Item -Path (Join-Path $root "node_modules") -Destination $publish -Recurse -Force

      - name: Deploy to MonsterASP.NET
        uses: rasmusbuchholdt/simply-web-deploy@2.2.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
